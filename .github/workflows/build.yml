name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Validate OpenSpec
        run: OPENSPEC_TELEMETRY=0 npx -y @fission-ai/openspec@latest validate --all --no-interactive
      - name: Test
        run: ./build.sh test
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: local-dictation-apk
          path: build/local-dictation.apk
